name: Run Lottery Prediction

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paddlepaddle pandas numpy scikit-learn requests beautifulsoup4 lxml

      - name: Show files before update
        run: |
          echo "===== Repository files ====="
          ls -lah

          echo ""
          echo "===== CSV files before update ====="
          ls -lah *.csv || true

      - name: Update lottery data
        run: |
          echo "===== Updating lottery data ====="

          if [ -f update_dlt_official.py ]; then
            echo "Found update_dlt_official.py, running it..."
            python update_dlt_official.py
          elif [ -f update_data1.py ]; then
            echo "Found update_data1.py, running it..."
            python update_data1.py
          else
            echo "No update script found. Skip data update."
          fi

      - name: Save latest data preview
        run: |
          echo "===== Latest data preview =====" > latest_data_preview.txt
          echo "" >> latest_data_preview.txt

          echo "===== Latest lotto.csv top 10 rows =====" >> latest_data_preview.txt
          if [ -f lotto.csv ]; then
            head -n 10 lotto.csv >> latest_data_preview.txt
          else
            echo "lotto.csv not found" >> latest_data_preview.txt
          fi

          echo "" >> latest_data_preview.txt
          echo "===== Latest lotto_clean.csv top 10 rows =====" >> latest_data_preview.txt
          if [ -f lotto_clean.csv ]; then
            head -n 10 lotto_clean.csv >> latest_data_preview.txt
          else
            echo "lotto_clean.csv not found" >> latest_data_preview.txt
          fi

          echo ""
          cat latest_data_preview.txt

      - name: Show model files
        run: |
          echo "===== checkpoints_best ====="
          ls -lah checkpoints_best || true

          echo ""
          echo "===== checkpoints ====="
          ls -lah checkpoints || true

      - name: Run CPU prediction
        run: |
          echo "===== Running CPU prediction ====="
          set -o pipefail
          python predict_cpu_fixed.py 2>&1 | tee prediction_output.txt

      - name: Upload prediction results
        uses: actions/upload-artifact@v4
        with:
          name: prediction-results
          path: |
            prediction_output.txt
            latest_data_preview.txt
